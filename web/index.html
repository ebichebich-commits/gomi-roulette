<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0626">
<title>ゴミ捨て・掃除黄金戦士ルーレット</title>
<style>
  :root {
    --gold1: #fff3a8;
    --gold2: #f5c518;
    --gold3: #b8860b;
    --red1: #ff4b4b;
    --red2: #c40a14;
    --red3: #6e0008;
    --ink: #170320;
    --panel: rgba(24, 4, 34, 0.88);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    color: #fff;
    color-scheme: dark;
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255, 80, 180, .55), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(255, 210, 40, .38), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(200, 20, 40, .6), transparent 52%),
      linear-gradient(160deg, #3a0c4a 0%, #1a0528 50%, #0c0214 100%);
    background-attachment: fixed;
    line-height: 1.35;
    display: flex; flex-direction: column;
  }
  body::before { /* きらきら（Chromeでも加算で明るく） */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: .85;
    mix-blend-mode: screen;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 120px 90px, #ffe27a, transparent),
      radial-gradient(1.5px 1.5px at 210px 40px, #fff, transparent),
      radial-gradient(2px 2px at 300px 150px, #ff9bd0, transparent),
      radial-gradient(1.5px 1.5px at 60px 170px, #fff, transparent);
    background-size: 340px 210px;
    animation: twinkle 3.2s ease-in-out infinite alternate;
  }
  body::after { /* 全体の加算ハイライト（Chromeの暗さを補正） */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    mix-blend-mode: screen;
    opacity: .35;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255, 200, 80, .55), transparent 60%),
      radial-gradient(ellipse 50% 40% at 15% 80%, rgba(255, 60, 140, .4), transparent 55%),
      radial-gradient(ellipse 45% 35% at 90% 70%, rgba(255, 120, 40, .35), transparent 50%);
  }
  header, main { position: relative; z-index: 1; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: .8; } }

  header {
    text-align: center; padding: 6px 8px 2px; position: relative; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
  }
  .tag {
    display: inline-block; font-weight: 900; font-style: italic; letter-spacing: .12em;
    font-size: 12px; padding: 2px 12px; border-radius: 999px;
    background: linear-gradient(180deg, var(--gold1), var(--gold2) 55%, var(--gold3));
    color: #4a0010; box-shadow: 0 0 14px rgba(255, 210, 0, .7);
  }
  h1 {
    position: relative;
    margin: 0; font-size: clamp(34px, 4.8vw, 64px); font-weight: 900; font-style: italic;
    letter-spacing: .06em; line-height: 1.15;
    background: linear-gradient(180deg, #fffef0 0%, #ffe27a 30%, #ffd000 48%, #c98a00 55%, #fff3a8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #5a0010) drop-shadow(0 0 14px rgba(255, 220, 80, 1)) drop-shadow(0 0 32px rgba(255, 90, 40, .85));
  }
  /* Chrome: filter影が弱いとき用の加算アウトライン */
  h1::after {
    content: attr(data-title);
    position: absolute; left: 0; right: 0; top: 0;
    background: inherit; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: blur(10px) brightness(1.4);
    mix-blend-mode: screen;
    opacity: .55; pointer-events: none; z-index: -1;
  }
  header { isolation: isolate; }

  main {
    flex: 1 1 auto; min-height: 0;
    display: grid; gap: 8px; padding: 4px 8px 8px; width: 100%; max-width: none; margin: 0;
    grid-template-columns: minmax(180px, 22vw) minmax(0, 1fr) minmax(220px, 26vw);
    align-items: stretch;
  }
  .panel {
    background: var(--panel); border-radius: 12px; padding: 8px 10px;
    border: 2px solid transparent; min-height: 0; overflow: auto;
    background-image: linear-gradient(var(--panel), var(--panel)),
      linear-gradient(135deg, var(--gold1), var(--gold3) 40%, var(--gold2) 60%, var(--red1));
    background-origin: border-box; background-clip: padding-box, border-box;
    box-shadow: 0 0 22px rgba(255, 60, 60, .25), inset 0 0 28px rgba(255, 190, 0, .08);
    display: flex; flex-direction: column;
  }
  h2 {
    margin: 0 0 6px; text-align: center; font-size: 15px; font-weight: 900; font-style: italic;
    color: var(--gold1); text-shadow: 0 0 10px rgba(255, 190, 0, .8); flex: 0 0 auto;
  }
  h3 { margin: 8px 0 4px; font-size: 13px; color: var(--gold2); }
  .small { font-size: 11px; opacity: .8; }

  /* 今週の1枚 / クイズ */
  #weeklyTitle { font-size: clamp(18px, 2vw, 26px); }
  #weeklyTitle.quiz { color: #ff6a6a; text-shadow: 0 0 12px rgba(255, 40, 40, .9); }
  .bubble {
    position: relative; margin: 0 0 14px; padding: 14px 12px; border-radius: 12px;
    background: linear-gradient(180deg, #fff, #ffeab0); color: #2a0010; font-weight: 800;
    border: 3px solid var(--red2); text-align: center; white-space: pre-wrap;
    font-size: clamp(18px, 1.8vw, 28px); line-height: 1.45;
    box-shadow: 0 0 14px rgba(255, 60, 60, .55);
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -14px; margin-left: -12px;
    border: 12px solid transparent; border-top-color: var(--red2); border-bottom: 0;
  }
  #weeklyImg {
    display: block; width: 100%; max-height: calc(100vh - 120px); object-fit: contain;
    border-radius: 10px; border: 2px solid var(--gold2);
    box-shadow: 0 0 18px rgba(255, 200, 0, .45); background: #000; flex: 1 1 auto;
  }
  #weeklyCaption { text-align: center; font-size: 11px; margin-top: 4px; opacity: .8; word-break: break-all; flex: 0 0 auto; }

  /* ルーレット */
  .stage {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-height: 0; height: 100%; justify-content: center;
  }
  .wheel-wrap {
    width: min(100%, calc(100vh - 168px), 72vw);
    max-width: 100%; aspect-ratio: 1; flex: 0 1 auto;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
  #info {
    text-align: center; font-weight: 800; min-height: 0; font-size: 12px;
    text-shadow: 0 0 8px #000; flex: 0 0 auto; max-width: 100%;
  }
  #status { font-size: 11px; opacity: .8; text-align: center; flex: 0 0 auto; }
  #winner {
    min-height: 0; width: 100%; text-align: center; white-space: pre-line; font-weight: 900;
    font-size: clamp(15px, 1.7vw, 24px); padding: 8px 12px; border-radius: 10px;
    color: #fff8d0;
    text-shadow: 0 1px 0 #3a0010;
    background: linear-gradient(180deg, rgba(20, 8, 0, .82), rgba(40, 12, 0, .88));
    border: 2px solid rgba(255, 210, 0, .75);
    box-shadow: inset 0 0 18px rgba(255, 200, 0, .12);
    flex: 0 0 auto;
  }
  /* 金色名：赤背景に負けないよう実色＋黒縁（transparent clip は使わない） */
  #winner .gold-name, .modal .gold-name, .modal.fx-win .big.gold-name {
    display: inline-block;
    font-weight: 900;
    font-size: 1.35em;
    color: #ffe566 !important;
    background: none !important;
    -webkit-background-clip: initial !important;
    background-clip: initial !important;
    -webkit-text-fill-color: #ffe566;
    -webkit-text-stroke: 0;
    paint-order: stroke fill;
    text-shadow:
      -2px -2px 0 #3a1500,
      2px -2px 0 #3a1500,
      -2px 2px 0 #3a1500,
      2px 2px 0 #3a1500,
      0 0 10px rgba(255, 230, 80, .95),
      0 0 22px rgba(255, 200, 0, .75),
      0 3px 0 #5a2800;
    filter: none;
  }
  .modal.fx-win .gold-name, .modal.fx-win .big.gold-name {
    font-size: clamp(48px, 12vw, 88px) !important;
    color: #ffe566 !important;
    -webkit-text-fill-color: #ffe566;
    text-shadow:
      -3px -3px 0 #2a1000,
      3px -3px 0 #2a1000,
      -3px 3px 0 #2a1000,
      3px 3px 0 #2a1000,
      0 0 16px #fff6a0,
      0 0 36px #ffd000,
      0 4px 0 #5a2800;
  }
  .modal.fx-win {
    background: radial-gradient(circle at 50% 0%, #4a2810, #140808 70%) !important;
  }

  button {
    font: inherit; font-weight: 900; cursor: pointer; border: 0; border-radius: 10px; padding: 7px 10px;
    color: #4a0010; background: linear-gradient(180deg, var(--gold1), var(--gold2) 55%, var(--gold3));
    box-shadow: 0 3px 0 #6b4500, 0 0 12px rgba(255, 210, 0, .45); transition: transform .06s;
    font-size: 13px;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6b4500; }
  button.red { color: #fff4c0; background: linear-gradient(180deg, var(--red1), var(--red2) 55%, var(--red3)); box-shadow: 0 3px 0 #3a0006, 0 0 14px rgba(255, 40, 40, .6); }
  button.dark { color: #ffe9a0; background: linear-gradient(180deg, #4a1d5e, #260a35); box-shadow: 0 3px 0 #0e0216; }
  button:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.5); }
  .attack {
    width: 100%; font-size: clamp(16px, 2vw, 24px); font-style: italic; letter-spacing: .06em; padding: 8px;
    border-radius: 6px 20px 6px 20px; animation: pulse 1.4s ease-in-out infinite; flex: 0 0 auto;
  }
  .attack:disabled { animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 3px 0 #3a0006, 0 0 26px rgba(255, 90, 40, .95); } }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; flex: 0 0 auto; }
  .row > button { flex: 1 1 auto; }

  #excludeList {
    max-height: none; flex: 0 1 auto; overflow: auto; padding: 6px; border-radius: 10px; display: grid; gap: 2px;
    background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 210, 0, .35); min-height: 0;
  }
  #excludeList label { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 8px; font-size: 13px; }
  #excludeList input { width: 16px; height: 16px; accent-color: #ff3b3b; }
  #excludeList label:has(input:checked) { background: rgba(255, 40, 40, .3); }
  #ranking {
    flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px; border-radius: 10px; font-size: 14px;
    background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 210, 0, .35);
  }
  #ranking .rank-sec {
    margin: 0 0 10px; font-size: 15px; font-weight: 900; color: var(--gold1);
    text-shadow: 0 0 8px rgba(255,190,0,.6);
  }
  #ranking .rank-note { font-size: 12px; opacity: .85; margin-bottom: 8px; white-space: pre-wrap; }
  #ranking .rank-row {
    display: grid; grid-template-columns: 28px minmax(52px, 72px) 1fr auto;
    gap: 6px; align-items: center; margin: 0 0 7px; font-size: 14px; font-weight: 800;
  }
  #ranking .rank-no { color: var(--gold2); text-align: center; }
  #ranking .rank-name { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ranking .rank-bar-wrap {
    height: 16px; border-radius: 999px; background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,210,0,.35); overflow: hidden;
  }
  #ranking .rank-bar {
    height: 100%; border-radius: 999px; min-width: 4px;
    background: linear-gradient(90deg, #ff4b4b, #ffd000 55%, #fff3a8);
    box-shadow: 0 0 10px rgba(255,80,40,.55);
  }
  #ranking .rank-bar.dim {
    /* 非対象も黄色のまま。少し薄くするだけ */
    background: linear-gradient(90deg, #ff4b4b, #ffd000 55%, #fff3a8);
    box-shadow: none; opacity: .42;
  }
  #ranking .rank-meta { font-size: 12px; color: #ffe9a0; white-space: nowrap; min-width: 7.5em; text-align: right; }
  #ranking .rank-st { grid-column: 2 / -1; font-size: 11px; opacity: .75; margin: -4px 0 4px; }
  .panel h2.rank-title { margin-top: 8px; font-size: 17px; }

  /* モーダル */
  #overlay {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(5, 0, 10, .78); padding: 16px; backdrop-filter: blur(2px);
  }
  #overlay.open { display: flex; }
  .modal {
    width: min(94vw, 560px); max-height: 92vh; overflow: auto; text-align: center; padding: 22px 20px;
    border-radius: 20px; border: 3px solid var(--gold2);
    background: radial-gradient(circle at 50% 0%, #6e0a24, #2a0838 70%);
    box-shadow: 0 0 40px rgba(255, 190, 0, .55), inset 0 0 30px rgba(255, 60, 60, .25);
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }
  .modal .head { font-size: 20px; font-weight: 800; }
  .modal .big {
    font-size: clamp(32px, 8vw, 56px); font-weight: 900; margin: 8px 0; color: #fff3a8;
    text-shadow: 0 0 18px #ff3b3b, 0 3px 0 #6e0008;
  }
  .modal .praise { font-size: clamp(40px, 10vw, 72px); color: #ffb13b; }
  .modal .body { white-space: pre-wrap; margin: 8px 0 14px; }
  .modal .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .modal .btns button { min-width: 130px; font-size: 17px; }
  .modal.answer {
    width: min(96vw, 960px); min-height: 70vh; display: flex; flex-direction: column; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #3a0a52, #0a0214 75%);
  }
  .modal.answer img { max-width: 100%; max-height: 42vh; margin: 0 auto 10px; border-radius: 10px; border: 2px solid var(--gold2); }
  .modal.answer .big { color: #ff6b6b; font-size: clamp(30px, 7vw, 64px); white-space: pre-wrap; }
  .tabquiz { width: auto; padding: 14px 18px; border-radius: 12px; background: #a8dadc; border: 3px solid #1d3557; box-shadow: 0 0 24px rgba(168, 218, 220, .6); }
  .tabquiz .row2 { display: flex; align-items: center; gap: 16px; color: #1d3557; font-weight: 900; font-size: 18px; }
  .tabquiz button { color: #fff; background: #e63946; box-shadow: none; font-size: 20px; padding: 8px 18px; }
  textarea.msg { width: 100%; height: 180px; border-radius: 10px; padding: 8px; font: inherit; font-size: 13px; color: #170320; }

  /* 演出オーバーレイ（全画面・端まで届くストライプ） */
  #fx {
    position: fixed; inset: 0; z-index: 80; display: none; pointer-events: none;
    overflow: hidden;
  }
  #fx.on { display: block; pointer-events: auto; }
  #fx .fx-bg { position: absolute; inset: 0; }
  #fx .fx-spin-wrap {
    position: absolute; left: 50%; top: 50%;
    width: 300vmax; height: 300vmax;
    margin: -150vmax 0 0 -150vmax;
    animation: spinburst 10s linear infinite;
    will-change: transform;
  }
  #fx .fx-burst {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #ff0040, #ffd000, #00ff88, #ff00cc, #ff4b00, #ff0040);
    opacity: .7; filter: saturate(1.3);
  }
  #fx .fx-rays {
    position: absolute; inset: 0;
    background: repeating-conic-gradient(
      from 0deg,
      #ff2d55 0deg 7deg,
      #ffd000 7deg 14deg,
      #39ff14 14deg 21deg,
      #00e5ff 21deg 28deg,
      #c77dff 28deg 35deg,
      #ff7a00 35deg 42deg
    );
    opacity: .92;
  }
  #fx .fx-vignette {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 8%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.72) 100%);
  }
  #fx.win .fx-bg { background: #1a0508; }
  #fx.praise .fx-bg { background: #2a0860; }
  #fx.fail .fx-bg { background: #000; }
  #fx.yes .fx-bg { background: #2a0008; }
  #fx .fx-feather, #fx .fx-spark, #fx .fx-fire {
    position: absolute; border-radius: 50%; pointer-events: none;
  }
  #fx .fx-feather {
    width: 18px; height: 28px; background: linear-gradient(180deg, #fff, #ddd); opacity: .85;
    border-radius: 50% 50% 40% 40%; animation: floatDown linear forwards;
    box-shadow: 0 0 8px #fff;
  }
  #fx .fx-spark {
    width: 6px; height: 6px; background: #ffe27a; box-shadow: 0 0 10px #ffd000;
    animation: sparkle ease-out forwards;
  }
  #fx .fx-fire {
    width: 8px; height: 8px; background: #ffb000; box-shadow: 0 0 14px #ff4000;
    animation: firework ease-out forwards;
  }
  #fx .fx-crown {
    position: absolute; left: 50%; top: 6%; transform: translateX(-50%);
    font-size: clamp(48px, 11vw, 96px); filter: drop-shadow(0 0 16px gold);
    animation: bounceIn .5s ease-out; z-index: 2;
  }
  #fx .fx-curtains::before, #fx .fx-curtains::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 14%; z-index: 1;
    background: linear-gradient(90deg, #6e0008, #c40a14 40%, #8a0010);
    opacity: .8; box-shadow: 0 0 30px rgba(180,0,20,.6);
  }
  #fx .fx-curtains::before { left: 0; border-radius: 0 40% 40% 0 / 0 20% 20% 0; }
  #fx .fx-curtains::after { right: 0; border-radius: 40% 0 0 40% / 20% 0 0 20%; }
  #fx .fx-spot {
    position: absolute; left: 50%; bottom: 8%; width: 50vmin; height: 18vmin;
    margin-left: -25vmin; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.55), transparent 70%);
  }
  #fx .fx-splash {
    position: absolute; left: 50%; top: 50%; z-index: 5;
    transform: translate(-50%, -50%);
    width: min(96vw, 1100px); text-align: center; padding: 0 12px;
    font-weight: 900; font-style: italic; letter-spacing: .06em;
    font-size: clamp(52px, 12vw, 120px); line-height: 1.05;
    color: #fff8c0;
    text-shadow:
      0 0 12px #fff,
      0 0 28px #ffd000,
      0 0 48px #ff0040,
      4px 4px 0 #5a0010,
      -2px -2px 0 #ff0040;
    -webkit-text-stroke: 2px #5a0010;
    animation: splashIn .55s cubic-bezier(.2,1.4,.4,1) both, splashShine 1.1s ease-in-out .4s infinite alternate;
    filter: drop-shadow(0 0 24px rgba(255,210,0,.9));
  }
  #fx.fail .fx-splash {
    color: #777; -webkit-text-stroke: 1px #222;
    text-shadow: 0 0 18px rgba(255,255,255,.15); animation: splashIn .55s ease-out both;
  }
  @keyframes spinburst { to { transform: rotate(360deg); } }
  @keyframes splashIn {
    from { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; }
    70% { transform: translate(-50%, -50%) scale(1.12) rotate(2deg); opacity: 1; }
    to { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  }
  @keyframes splashShine {
    from { filter: drop-shadow(0 0 18px rgba(255,210,0,.7)) brightness(1); }
    to { filter: drop-shadow(0 0 40px rgba(255,80,40,1)) brightness(1.15); }
  }
  @keyframes floatDown {
    from { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    15% { opacity: .9; }
    to { transform: translateY(110vh) rotate(240deg); opacity: 0; }
  }
  @keyframes sparkle {
    from { transform: scale(0); opacity: 1; }
    to { transform: scale(1.8) translate(var(--dx), var(--dy)); opacity: 0; }
  }
  @keyframes firework {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  @keyframes bounceIn {
    from { transform: translateX(-50%) scale(.3); opacity: 0; }
    60% { transform: translateX(-50%) scale(1.15); }
    to { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  .modal.fx-win {
    background: radial-gradient(circle at 50% 0%, #4a2810, #140808 75%) !important;
    border-color: #ffd000; box-shadow: 0 0 50px rgba(255,200,0,.7), inset 0 0 40px rgba(255,180,0,.2);
  }
  .modal.fx-win .big {
    font-size: clamp(40px, 10vw, 72px);
  }
  .modal.fx-win .big.gold-name {
    background: none !important;
    -webkit-background-clip: initial !important;
    background-clip: initial !important;
    color: #ffe566 !important;
    -webkit-text-fill-color: #ffe566;
    filter: none;
  }
  .modal.fx-praise {
    background: radial-gradient(circle at 50% 20%, #fff7c0, #ff6ad5 50%, #3a0080 100%);
    border-color: #fff; width: min(96vw, 720px);
  }
  .modal.fx-praise .praise {
    font-size: clamp(48px, 12vw, 96px); font-weight: 900;
    background: linear-gradient(180deg, #fff, #ffe27a 35%, #ffd000 50%, #fff8c0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 20px #fff) drop-shadow(0 4px 0 #a00040);
    animation: pulseGold 1s ease-in-out infinite alternate;
  }
  @keyframes pulseGold { from { transform: scale(1); } to { transform: scale(1.06); } }
  .modal.fx-fail {
    background: #050505; border-color: #333; color: #777;
    box-shadow: 0 0 40px rgba(0,0,0,.9), inset 0 -80px 80px rgba(255,255,255,.06);
  }
  .modal.fx-fail .big {
    color: #5a5a5a; text-shadow: none; filter: none;
    font-size: clamp(36px, 9vw, 68px); letter-spacing: .12em;
  }
  .modal.fx-yes {

  async function ensureTickBuffer() {
    if (tickBuffer) return true;

      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      if (!tickAudioCtx) tickAudioCtx = new AC();
      const res = await fetch("/sounds/tick.mp3", { cache: "force-cache" });

    if (tickAudioCtx && tickAudioCtx.state === "suspended") {

  }
  function playTickOverlap(vol) {
    const now = performance.now();
    if (now - tickLastAt < TICK_COOLDOWN_MS) return;
    tickLastAt = now;

    if (tickBuffer && tickAudioCtx) {
      try {
        const src = tickAudioCtx.createBufferSource();
        src.buffer = tickBuffer;
        const gain = tickAudioCtx.createGain();
        gain.gain.value = vol == null ? 0.7 : Math.max(0, Math.min(1, vol));
        src.connect(gain);
        gain.connect(tickAudioCtx.destination);
        src.start(0);

        src.onended = () => { try { src.disconnect(); gain.disconnect(); } catch (e) {} };

    members.forEach(m => {
      if (pg.has(m) && !gp.includes(m)) gp.push(m);
      if (ps.has(m) && !sp.includes(m)) sp.push(m);
    });
    candG = gp; candS = sp;
    if (useWeekSlots()) {
      // 除外チェック用：今週枠のユニーク名（重複枠は帳尻合わせ）
      candidates = [...new Set(activeWeekSlots)];
    } else {
      candidates = [...new Set([...gp, ...sp])].sort((a, b) => members.indexOf(a) - members.indexOf(b));
    }
  }

  function roleWeights(role) {
    const primary = role === ROLE_GOMI ? wG : wS;
    const secondary = role === ROLE_GOMI ? wS : wG;
    const merged = { ...primary };
    for (const [m, wRaw] of Object.entries(secondary)) {
      const w = Number(wRaw);
      if (!(w > 0) || w === 1) continue;
      const cur = merged[m] != null ? Number(merged[m]) : 1;
      // ペナルティ(>1)は大きい方、貢献割引(<1)は小さい方を採用
      merged[m] = w > 1 ? Math.max(cur, w) : Math.min(cur, w);
    }
    // 今週特別枠のブーストは枠が終わるまでだけ重ねる（保存後は消える）
    if (useWeekSlots() && !weekSlotsContinue) {
      for (const [m, mul] of Object.entries(THIS_WEEK_BOOST)) {
        merged[m] = Math.max(Number(merged[m]) || 1.0, mul);
      }
    } else if (useWeekSlots() && weekSlotsContinue) {
      for (const [m, mul] of Object.entries(THIS_WEEK_BOOST)) {
        if (merged[m] != null) continue;
        merged[m] = mul;
      }
    }
    members.forEach(m => { if (merged[m] == null) merged[m] = 1; });
    return merged;
  }
  /** 総合危険度：ゴミ／掃除の高い方（今週枠ブースト＋未実施＋貢献割引） */
  function personalWeight(m) {
    const gw = wG[m] != null ? Number(wG[m]) : 1;
    const sw = wS[m] != null ? Number(wS[m]) : 1;
    let w = Math.max(gw, sw);
    if (useWeekSlots() && !weekSlotsContinue && THIS_WEEK_BOOST[m]) {
      w = Math.max(w, THIS_WEEK_BOOST[m]);
    }
    return w;
  }
  const roleCandidates = role => (role === ROLE_GOMI ? candG : candS);

  function activePool() {
    if (useWeekSlots()) {
      let pool = activeWeekSlots.filter(m => !isOutOfWheel(m));
      if (drawRole === ROLE_SOUJI && sessionG) pool = pool.filter(m => m !== sessionG);
      return pool; // 同名の重複枠をそのまま残す
    }
    let pool = roleCandidates(drawRole).filter(m => !isOutOfWheel(m));
    if (drawRole === ROLE_SOUJI && sessionG) pool = pool.filter(m => m !== sessionG);
    return pool;
  }
  function wheelOrder() {
    const wm = roleWeights(drawRole);
    // 重複枠があるので安定ソート（同倍率は元の並びを維持）
    return activePool()
      .map((m, i) => ({ m, i, w: wm[m] ?? 1 }))
      .sort((a, b) => (b.w - a.w) || (a.i - b.i))
      .map(x => x.m);
  }

  function canRunBoth() {
    if (useWeekSlots()) {
      const names = [...new Set(activeWeekSlots.filter(m => !isOutOfWheel(m)))];
      if (names.length < 2) return [false, "ゴミと掃除の両方を決める人が足りません。自己申告免除を減らしてください。"];
      return [true, ""];
    }
    const ga = candG.filter(m => !isOutOfWheel(m));
    const sa = candS.filter(m => !isOutOfWheel(m));
    if (!ga.length || !sa.length) return [false, "ゴミまたは掃除の候補がいません。自己申告免除を減らしてください。"];
    for (const g of ga) {
      if (!sa.filter(m => m !== g).length) {
        return [false, "どの組み合わせでも掃除当番が決められません。\n（掃除候補がゴミ当選者しかいない状態になり得ます）\n免除または名簿を見直してください。"];
      }
    }
    return [true, ""];
  }

  async function checkPrevious(role) {
    const last = role === ROLE_GOMI ? lastG : lastS;
    const done = role === ROLE_GOMI ? doneGomi : doneSouji;
    if (!last || done.includes(last)) return;
    const duty = roleName(role);
    const extraLabel = role === ROLE_GOMI ? "ゴミ袋を替えた" : "掃除機の中身を捨てた";
    const boost = THIS_WEEK_BOOST[last] ?? 1;
    const r = await modal(
      `<div class="head">前回の${duty}当番は【 ${esc(last)} 】さんでした。</div><div class="head" style="margin-top:8px">任務（${duty}）は完了しましたか？</div>`,
      [{ label: "はい（完了した）", value: "yes" }, { label: "いいえ（まだ）", value: "no", cls: "red" }, { label: extraLabel, value: "extra", cls: "dark" }]);
    const wmap = role === ROLE_GOMI ? wG : wS;
    if (r === "yes" || r === "extra") {
      if (!done.includes(last)) done.push(last);
      // 達成済み → 今週のルーレットから外す（ブースト対象・通常週どちらも）
      alreadyDoneExempt.add(last);
      delete wmap[last];
      if (r === "yes") {
        await splashFx("yes", pickPhrase("yes"), 2400);
        await modal(
          `<div class="head">任務完了！</div><div class="big">いざ出陣！</div><div class="head" style="margin-top:8px">【 ${esc(last)} 】さん ${esc(duty)}当番 完了<br><span style="font-size:16px">今週のルーレットは達成済みのため対象外</span></div>`,
          [{ label: "OK", value: true, cls: "red" }], "fx-yes");
      } else {
        await splashFx("praise", pickPhrase("praise"), 2600);
        await modal(
          `<div class="big praise">えらい！感謝！</div><div class="big" style="font-size:clamp(28px,6vw,44px)">【 ${esc(last)} 】さん</div><div class="head">${esc(extraLabel)}<br><span style="font-size:16px">今週のルーレットは達成済みのため対象外</span></div>`,
          [{ label: "OK", value: true, cls: "red" }], "fx-praise");
      }
      computePools();
      renderAll();
    } else {
      // 未実施 → 残す。現在倍率（ブースト含む）にさらに ×10（例: 10 → 100）
      const cur = Math.max(Number(wmap[last]) || 1, Number(wG[last]) || 1, Number(wS[last]) || 1, THIS_WEEK_BOOST[last] ?? 1);
      const next = cur * PENALTY_RATE;
      wG[last] = Math.max(Number(wG[last]) || 1, next);
      wS[last] = Math.max(Number(wS[last]) || 1, next);
      prevUnfinished.add(key(role, last));
      alreadyDoneExempt.delete(last);
      playSadBgm();
      await splashFx("fail", pickPhrase("fail"), 2200);
      await modal(
        `<div class="big">任務未完了</div><div class="big" style="font-size:clamp(28px,7vw,52px);margin-top:8px">終了</div><div class="body" style="margin-top:14px;color:#999">${esc(last)}さんの${esc(duty)}当番：まだなので<strong>今週ルーレットに残ります</strong>。\n倍率 ${cur} × ${PENALTY_RATE} → <b>${next}倍</b>\nランキング・ルーレット角度にも反映します。\n\n（クリックでBGM停止）</div>`,
        [{ label: "OK", value: true, cls: "dark" }], "fx-fail");
      stopSadBgm();
      computePools();
      renderAll();
    }
  }

  function carryOnlyUnfinishedPenalties() {
    const dG = new Set(doneGomi), dS = new Set(doneSouji), ms = new Set(members);
    const carry = (role, m, w, doneSet) => {
      if (!ms.has(m)) return null;
      if (prevUnfinished.has(key(role, m))) return Math.max(w, PENALTY_RATE) + ROUND_CARRY_STEP;
      if (w >= PENALTY_RATE) return (w - (PENALTY_RATE - 1)) + ROUND_CARRY_STEP;
      if (doneSet.has(m)) return null;
      return w;
    };
    const conv = (o, role, doneSet) => {
      const out = {};
      for (const [m, w] of Object.entries(o)) { const c = carry(role, m, w, doneSet); if (c !== null) out[m] = c; }
      return out;
    };
    wG = conv(wG, ROLE_GOMI, dG);
    wS = conv(wS, ROLE_SOUJI, dS);
  }

  async function checkCycleReset() {
    const assigned = new Set([...doneGomi, ...doneSouji]);
    if (lastG) assigned.add(lastG);
    if (lastS) assigned.add(lastS);
    if (!members.length || !members.every(m => assigned.has(m))) return;
    if (lastG && lastS && prevUnfinished.size >= 2) {
      await info("未実施あり", "前回のゴミ捨て・掃除がどちらも未実施でした。\n2人を残して、今の周のまま続けます。");
      return;
    }
    carryOnlyUnfinishedPenalties();
    await info("祝！一周完了", "全員が一度ずつ当番に割り当てられました！\n前回分の確認を反映して、新しい周を開始します。\n未実施の当番がある人は、倍率アップのまま次のルーレットに残ります。");
    doneGomi = []; doneSouji = [];
    lastG = ""; lastS = "";
  }

  function applyExclusionBonus() {
    for (const role of [ROLE_GOMI, ROLE_SOUJI]) {
      const base = roleCandidates(role);
      const wm = roleWeights(role);
      const target = role === ROLE_GOMI ? wG : wS;
      const total = base.reduce((s, m) => s + (wm[m] ?? 1), 0);
      // 自己申告免除のみ翌週向けボーナス（達成済み扱いの人は対象外）
      weeklyExcluded.forEach(m => {
        if (alreadyDoneExempt.has(m)) return;
        const w = wm[m] ?? 1;
        if (total > 0) target[m] = (target[m] ?? 1) * (1 + w / total);
      });
    }
  }

  // ---------- 右パネル：総合危険度（実倍率＝ブースト×未実施積み上げ） ----------
  function renderRanking() {
    // 抽選中は今の役割の相対割合、それ以外は総合（高い方）
    const useRole = confirmed;
    const rows = members.map((m, idx) => ({
      m,
      w: useRole ? effectiveWeight(drawRole, m) : personalWeight(m),
      idx,
    }));
    rows.sort((a, b) => (b.w - a.w) || (a.idx - b.idx));
    // 割合は「今ルーレットに出る候補」基準。確定前は全員の相対
    const poolSet = new Set(useRole ? activePool() : members);
    const total = rows.reduce((s, r) => s + (poolSet.has(r.m) ? r.w : 0), 0);
    const maxW = Math.max(1, ...rows.map(r => r.w));
    let h = `<div class="rank-note">総合危険度（相対割合＝ルーレット角度と同じ計算）\n${useWeekSlots() && !weekSlotsContinue ? "今週枠：幡鎌・芝原=10 / 上出=3 / 他=1\n" : ""}${useWeekSlots() && weekSlotsContinue ? "残り枠の続き（未抽選メンバー）\n" : ""}未実施「いいえ」→ 現倍率×10（例:10→100）で残る\n達成「はい」→ 今週ルーレットから外す\n部屋貢献→ 1回ごと×0.9（同名は繰り返し）</div>`;
    h += `<div class="rank-sec">── ${useRole ? roleName(drawRole) + "抽選の相対" : "総合"}ランキング ──</div>`;
    rows.forEach((r, i) => {
      const inPool = poolSet.has(r.m) && !isOutOfWheel(r.m);
      const prob = inPool && total > 0 ? (r.w / total) * 100 : 0;
      const bar = Math.max(4, Math.round((r.w / maxW) * 100));
      let st = "抽選対象";
      if (alreadyDoneExempt.has(r.m)) st = "達成済み（実施済み免除）";
      else if (weeklyExcluded.has(r.m)) st = "自己申告：今週免除";
      else if (sessionG === r.m) st = "今回のゴミ当番";
      else if (doneGomi.includes(r.m) && doneSouji.includes(r.m)) st = "今周完了済み";
      else if (doneGomi.includes(r.m) || doneSouji.includes(r.m)) st = "片方完了";
      if (prevUnfinished.has(key(ROLE_GOMI, r.m)) || prevUnfinished.has(key(ROLE_SOUJI, r.m))) {
        st += "／未実施×10積";
      }
      const dim = isOutOfWheel(r.m) || (doneGomi.includes(r.m) && doneSouji.includes(r.m));
      h += `<div class="rank-row">`;
      h += `<div class="rank-no">${i === 0 ? "👑" : (i + 1)}</div>`;
      h += `<div class="rank-name">${esc(r.m)}</div>`;
      h += `<div class="rank-bar-wrap"><div class="rank-bar${dim ? " dim" : ""}" style="width:${bar}%"></div></div>`;
      h += `<div class="rank-meta">${r.w % 1 === 0 ? r.w.toFixed(0) : r.w.toFixed(1)}倍 / ${inPool ? prob.toFixed(1) + "%" : "-"}</div>`;
      h += `</div><div class="rank-st">${esc(st)}</div>`;
    });
    $("ranking").innerHTML = h;
  }
  function renderExclude() {
    const box = $("excludeList");
    box.innerHTML = "";
    // 自己申告は今週ルーレット対象者から選ぶ（達成済み扱いは一覧に出さない）
    const list = (useWeekSlots() ? [...new Set(activeWeekSlots)] : candidates)
      .filter(m => !alreadyDoneExempt.has(m));
    list.forEach(m => {
      const l = document.createElement("label");
      const c = document.createElement("input");
      c.type = "checkbox"; c.checked = weeklyExcluded.has(m); c.disabled = confirmed || busy;
      c.onchange = () => {
        if (c.checked) weeklyExcluded.add(m);
        else weeklyExcluded.delete(m);
        renderAll();
      };
      l.append(c, document.createTextNode(m));
      box.appendChild(l);
    });
    if (!list.length) box.textContent = "自己申告の対象がいません。";
  }
  function renderInfo() {
    $("info").textContent = confirmed
      ? (drawRole === ROLE_GOMI ? "【1回目・ゴミ捨て当番】中央SPIN / [Space] / ボタンでスタート・ストップ" : "【2回目・掃除当番】中央SPIN / [Space] / ボタンでスタート・ストップ")
      : "まず「免除を確定する」を押してから抽選できます。\n（1回目：ゴミ捨て → 2回目：掃除）\n※途中で閉じた場合は抽選は無効。次回は最初からやり直しです。";
    $("info").style.whiteSpace = "pre-line";
    const slotN = useWeekSlots() ? activePool().length : null;
    $("status").textContent = useWeekSlots()
      ? `総メンバー: ${members.length}人 / ${weekSlotsContinue ? "残り枠" : "今週枠"}: ${activeWeekSlots.length} / 抽選中: ${slotN ?? "-"} / 自己申告免除: ${weeklyExcluded.size} / 達成済み: ${alreadyDoneExempt.size}`
      : `総メンバー: ${members.length}人 / ゴミ残り: ${candG.length} / 掃除残り: ${candS.length}`;
  }
  function renderButtons() {
    $("confirmBtn").disabled = confirmed || busy || finished;
    $("cancelBtn").disabled = !confirmed || spinning || busy || finished;
    $("clearBtn").disabled = spinning || busy || finished;
    $("spinBtn").disabled = !confirmed || busy || finished;
    $("spinBtn").textContent = spinning ? "STOP ■" : "ATTACK ≫";
  }
  function renderAll() { renderExclude(); renderInfo(); renderRanking(); renderButtons(); }

  // ---------- 今週の1枚 / クイズ ----------
  function renderWeekly() {
    const w = weekly, t = $("weeklyTitle"), q = $("weeklyQuiz"), img = $("weeklyImg");
    const hasQuiz = !!(w && w.quiz_question);
    t.textContent = hasQuiz ? "今週のクイズ！！" : "今週の1枚！！";
    t.classList.toggle("quiz", hasQuiz);
    q.hidden = !hasQuiz;
    if (hasQuiz) q.textContent = w.quiz_question;
    if (w && w.photos && w.photos.length) {
      const src = w.photos[Math.floor(Math.random() * w.photos.length)];
      img.src = src; img.hidden = false;

      $("weeklyCaption").textContent = hasQuiz ? "答えは今週の抽選がすべて終わったあとに表示します。" : name;
    } else {
      img.hidden = true;
      $("weeklyCaption").textContent = hasQuiz ? "答えは今週の抽選がすべて終わったあとに表示します。"
        : (w && w.week_folder ? "画像がありません" : "画像フォルダがありません");
    }
  }

  // ---------- ルーレット描画（パチンコ風） ----------
  function drawWheel(ts) {
    const W = canvas.width, cx = W / 2, cy = W / 2;
    const R = W / 2 - 6;               // 外枠の外周
    const rWheel = R * 0.80;           // 盤面半径
    ctx.clearRect(0, 0, W, W);

    // 外枠（金→赤→金）
    const ring = (r0, r1, stops) => {
      const g = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1);
      stops.forEach(([p, c]) => g.addColorStop(p, c));
      ctx.beginPath(); ctx.arc(cx, cy, r1, 0, Math.PI * 2); ctx.arc(cx, cy, r0, 0, Math.PI * 2, true);
      ctx.fillStyle = g; ctx.fill();
    };
    // 外周ブルーム（加算：Chromeでも影だけに頼らず明るく）
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const bloom = ctx.createRadialGradient(cx, cy, R * 0.72, cx, cy, R * 1.08);
    bloom.addColorStop(0, "rgba(255, 80, 40, 0)");
    bloom.addColorStop(0.55, "rgba(255, 90, 40, .22)");
    bloom.addColorStop(0.82, "rgba(255, 200, 60, .38)");
    bloom.addColorStop(1, "rgba(255, 60, 40, 0)");
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.08, 0, Math.PI * 2);
    ctx.fillStyle = bloom; ctx.fill();
    ctx.restore();

    ring(R * 0.90, R, [[0, "#8a5a00"], [.25, "#fff3a8"], [.5, "#d79a00"], [.8, "#fff0a0"], [1, "#7a4a00"]]);
    ring(R * 0.82, R * 0.90, [[0, "#5a0008"], [.3, "#e0101a"], [.6, "#ff5a4a"], [1, "#7a0010"]]);

    // 電飾（ちかちか）— 点灯は加算合成で重ねる
    const n = 36, t = (ts || 0) / 1000;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, rr = R * 0.86;
      const on = ((i + Math.floor(t * (spinning ? 14 : 4))) % 2 === 0);
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      const br = R * 0.02;
      ctx.beginPath(); ctx.arc(x, y, br, 0, Math.PI * 2);
      ctx.fillStyle = on ? "#fffbd0" : "#a06a00";
      ctx.fill();
      if (on) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const halo = ctx.createRadialGradient(x, y, 0, x, y, br * 4.5);
        halo.addColorStop(0, "rgba(255, 255, 220, .95)");
        halo.addColorStop(0.35, "rgba(255, 220, 80, .65)");
        halo.addColorStop(1, "rgba(255, 80, 40, 0)");
        ctx.beginPath(); ctx.arc(x, y, br * 4.5, 0, Math.PI * 2);
        ctx.fillStyle = halo; ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, br * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, .9)"; ctx.fill();
        ctx.restore();
      }
    }
    // 内側の黄色いリング
    ring(rWheel, R * 0.815, [[0, "#fff6b0"], [.5, "#ffd000"], [1, "#a06a00"]]);

    // 盤面の下地
    ctx.beginPath(); ctx.arc(cx, cy, rWheel, 0, Math.PI * 2);
    ctx.fillStyle = "#12031d"; ctx.fill();

    const order = wheelOrder();
    if (!candidates.length || !order.length) {
      ctx.fillStyle = "#ffe27a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `900 ${W * 0.05}px sans-serif`;
      ctx.fillText(!candidates.length ? "No Candidates" : "全員除外中", cx, cy - W * 0.02);
      if (candidates.length) { ctx.font = `700 ${W * 0.03}px sans-serif`; ctx.fillText("リストで調整してください", cx, cy + W * 0.04); }
      return;
    }
    const wm = roleWeights(drawRole);
    const total = order.reduce((s, m) => s + (wm[m] ?? 1), 0);
    let start = 0; // 度（反時計回り、右が0。roulette.py と同じ）
    order.forEach((m, i) => {
      const w = wm[m] ?? 1, ext = (w / total) * 360, c = SEG[i % SEG.length];
      const a0 = -start * Math.PI / 180, a1 = -(start + ext) * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, rWheel, a0, a1, true); ctx.closePath();
      const g = ctx.createRadialGradient(cx, cy, rWheel * 0.15, cx, cy, rWheel);
      g.addColorStop(0, c.b); g.addColorStop(.75, c.a); g.addColorStop(1, c.b);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = W * 0.004; ctx.stroke();

      // 名前：全員同じ向き（画面に対して正立の横書き）
      const mid = (start + ext / 2) * Math.PI / 180, ang = -mid;
      const px = cx + Math.cos(ang) * rWheel * 0.62, py = cy + Math.sin(ang) * rWheel * 0.62;
      const arc = ext * Math.PI / 180 * rWheel * 0.62;
      const fs = Math.max(Math.min(W * 0.048, arc * 0.5, rWheel * 0.1), W * 0.022);
      ctx.save(); ctx.translate(px, py);
      // rotateしない → みな同じ方向（上向き・横書き）
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `900 ${fs}px "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif`;
      ctx.lineJoin = "round"; ctx.lineWidth = fs * 0.22;
      ctx.strokeStyle = "rgba(0,0,0,.75)";
      ctx.strokeText(m, 0, -fs * 0.22); ctx.fillStyle = "#fffef0"; ctx.fillText(m, 0, -fs * 0.22);
      ctx.font = `800 ${fs * 0.52}px sans-serif`; ctx.lineWidth = fs * 0.14;
      const lab = `x${w.toFixed(1)}`;
      ctx.strokeText(lab, 0, fs * 0.52); ctx.fillStyle = "#ffe27a"; ctx.fillText(lab, 0, fs * 0.52);
      ctx.restore();
      start += ext;
    });

    // 光沢
    const gl = ctx.createRadialGradient(cx - rWheel * .3, cy - rWheel * .4, rWheel * .1, cx, cy, rWheel);
    gl.addColorStop(0, "rgba(255,255,255,.28)"); gl.addColorStop(.4, "rgba(255,255,255,.05)"); gl.addColorStop(1, "rgba(0,0,0,.25)");
    ctx.beginPath(); ctx.arc(cx, cy, rWheel, 0, Math.PI * 2); ctx.fillStyle = gl; ctx.fill();

    // 針（金のアロー）＋加算グロー
    const rad = -angle * Math.PI / 180;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rad);
    const L = rWheel * 0.96, bw = rWheel * 0.07;
    const arrowPath = () => {
      ctx.beginPath();
      ctx.moveTo(L, 0); ctx.lineTo(L - bw * 2.2, -bw * 1.4); ctx.lineTo(L - bw * 1.6, -bw * .35);
      ctx.lineTo(0, -bw * .35); ctx.lineTo(0, bw * .35); ctx.lineTo(L - bw * 1.6, bw * .35); ctx.lineTo(L - bw * 2.2, bw * 1.4);
      ctx.closePath();
    };
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    arrowPath();
    ctx.fillStyle = spinning ? "rgba(255, 220, 80, .55)" : "rgba(255, 200, 60, .32)";
    ctx.shadowColor = "rgba(255, 230, 120, 1)";
    ctx.shadowBlur = spinning ? 28 : 16;
    ctx.fill();
    ctx.restore();
    const ng = ctx.createLinearGradient(0, -bw, 0, bw);
    ng.addColorStop(0, "#fff7c0"); ng.addColorStop(.5, "#f5b800"); ng.addColorStop(1, "#8a5a00");
    arrowPath();
    ctx.fillStyle = ng; ctx.fill();
    ctx.lineWidth = W * 0.004; ctx.strokeStyle = "#5a0010"; ctx.stroke();
    ctx.restore();

    // ハブ（FINAL風メダル）
    const hr = rWheel * 0.17;
    const hg = ctx.createRadialGradient(cx - hr * .3, cy - hr * .4, hr * .1, cx, cy, hr);
    hg.addColorStop(0, "#fff7c0"); hg.addColorStop(.55, "#f2b800"); hg.addColorStop(1, "#7a4a00");
    ctx.beginPath(); ctx.arc(cx, cy, hr, 0, Math.PI * 2); ctx.fillStyle = hg; ctx.fill();
    ctx.lineWidth = hr * .12; ctx.strokeStyle = "#c40a14"; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, hr * .66, 0, Math.PI * 2);
    const hg2 = ctx.createRadialGradient(cx, cy - hr * .3, hr * .1, cx, cy, hr * .66);
    hg2.addColorStop(0, "#ff6a5a"); hg2.addColorStop(1, "#8a0010");
    ctx.fillStyle = hg2; ctx.fill();
    ctx.fillStyle = "#fff6c0"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `900 italic ${hr * .42}px sans-serif`;
    ctx.fillText(drawRole === ROLE_GOMI ? "ゴミ" : "掃除", cx, cy - hr * .12);
    ctx.font = `800 ${hr * .28}px sans-serif`;
    ctx.fillText(spinning ? "STOP" : "SPIN", cx, cy + hr * .32);
    hubR = hr;
  }

  // ---------- 抽選 ----------
  function startSpin() {
    spinning = true; stopping = false;
    speed = 25 + Math.random() * 15;
    lastTickSector = Math.floor(((angle % 360) + 360) % 360 / TICK_DEG);
    ensureTickBuffer().then(() => resumeTickAudio());
    resumeTickAudio();
    playSfx("click");
    $("winner").textContent = `抽選中…（${roleName(drawRole)}当番）`;
    renderButtons();
  }
  async function toggleSpin() {
    if (busy || finished) return;
    if (!spinning) {
      if (!confirmed) { clearExclusions(); return; }
      if (!activePool().length) { await info("抽選不可", "参加する人がいません。除外リストを確認してください。"); return; }
      startSpin();
    } else if (!stopping) {
      playSfx("click");
      stopping = true;
    }
  }
  let acc = 0, lastTs = 0;
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    acc += Math.min(ts - lastTs, 200); lastTs = ts;
    while (acc >= 20) {
      acc -= 20;
      if (spinning) {
        const prevAng = angle;
        angle = (angle + speed) % 360;
        // 矢印が20度進むごとに1回（0.1秒未満の連続はスキップ、重なり可）
        let from = Math.floor(prevAng / TICK_DEG);
        const to = Math.floor(angle / TICK_DEG);
        const sectors = 360 / TICK_DEG;
        let steps = 0;
        while (from !== to && steps < 2) {
          from = (from + 1) % sectors;
          playSfx("tick", Math.min(0.85, 0.35 + speed / 40));
          steps++;
        }
        lastTickSector = to;
        if (stopping) {
          speed *= 0.96;
          if (speed < 0.15) { speed = 0; spinning = false; stopping = false; determineWinner(); }
        }
      }
    }
    drawWheel(ts);
    requestAnimationFrame(loop);
  }

  async function determineWinner() {
    const order = wheelOrder();
    if (!order.length) return;
    busy = true; renderButtons();
    const wm = roleWeights(drawRole);
    const total = order.reduce((s, m) => s + (wm[m] ?? 1), 0);
    let cum = 0, winner = order[order.length - 1];
    for (const m of order) {
      const ext = ((wm[m] ?? 1) / total) * 360;
      if (cum <= angle && angle < cum + ext) { winner = m; break; }
      cum += ext;
    }
    // 同名が複数枠ある場合、当選確率は枠の合計で表示
    const winWeight = order.filter(m => m === winner).reduce((s, m) => s + (wm[m] ?? 1), 0);
    const rate = (winWeight / total) * 100;
    const role = drawRole;
    const winDlg = async () => {
      await splashFx("win", pickPhrase("win"), 2500);
      await modal(
        `<div class="head">今週の${role === ROLE_GOMI ? "ゴミ捨て" : "掃除"}当番は</div><div class="big gold-name">【 ${esc(winner)} 】</div><div class="head">さんです！</div><div class="body" style="margin-top:12px">この抽選での当選確率：${rate.toFixed(1)}%</div>`,
        [{ label: "OK", value: true, cls: "red" }], "fx-win");
    };

    if (role === ROLE_GOMI) {
      sessionG = winner;
      $("winner").innerHTML = `ゴミ捨て当番 決定\n<span class="gold-name">【 ${esc(winner)} 】</span>さん（この抽選 ${rate.toFixed(1)}%）\n\n続けて掃除当番を抽選\n（※掃除まで終えるまで保存されません）`;
      await winDlg();
      drawRole = ROLE_SOUJI;
      computePools(); busy = false; renderAll();
    } else {
      applyExclusionBonus();
      lastG = sessionG; lastS = winner;
      $("winner").innerHTML = `ゴミ捨て：<span class="gold-name">【 ${esc(sessionG)} 】</span>さん\n掃除：<span class="gold-name">【 ${esc(winner)} 】</span>さん\n（掃除の当選確率 ${rate.toFixed(1)}%）`;
      await winDlg();
      sessionG = null; drawRole = ROLE_GOMI; weeklyExcluded.clear(); confirmed = false;
      computePools(); renderAll();
      await afterFullSession();
    }
  }

  // ---------- クイズ答え → Teams連絡文 → コピーで初めて data 保存 ----------
  const REPORT_URL = "https://docs.google.com/spreadsheets/d/1dQkSW-dIugdTNqJ4usAkveFnUkIfIhv-E9gh1wFX7O4/edit?usp=sharing";
  const WIKI_URL = "https://www.hashimoto.lab.uec.ac.jp/intra/?%A5%B4%A5%DF%BC%CE%A4%C6%C5%F6%C8%D6";
  function teamsMessage(gomi, souji) {
    return (
      "ゴミ捨て→ \n\n" +
      (gomi || "未決定") + "\n" +
      "掃除→ \n\n" +
      (souji || "未決定") + "\n\n" +
      " ★★★★★★★★★★★★\n" +
      `当番報告スプレッドシート（${REPORT_URL} ）（←ここに報告！）\n` +
      "★★★★★★★★★★★★\n\n\n\n" +
      "・来週火曜日の時点できれいにしておくことを心がけてください！\n\n" +
      `掃除・ゴミ捨て方法Wiki（${WIKI_URL} ）`
    );
  }

  async function afterFullSession() {
    let ans = null;
    try { ans = await (await fetch(API + "/quiz-answer", { cache: "no-store" })).json(); } catch (e) { /* 答えなし扱い */ }
    if (ans && ans.answer) {
      await modal(`<div class="row2">今週のクイズ　答えはこちら</div>`, [{ label: "進", value: true }], "tabquiz");
      const img = ans.image ? `<img src="${ans.image}" alt="">` : "";
      await modal(`<div class="head" style="color:#a8dadc;font-size:34px">答え</div>${img}<div class="big">${esc(ans.answer)}</div>`,
        [{ label: "OK", value: true, cls: "red" }], "answer");
    }
    const pending = snapshotHistory();
    const msg = teamsMessage(pending.last_gomi_winner, pending.last_souji_winner);
    finished = false; busy = false; renderAll();
    $("info").textContent = "まだ data には保存していません。Teams連絡文をコピーすると保存されます。";
    const v = await modal(
      `<div class="head">Teams連絡文（コピーで保存）</div><div class="body">「連絡文をコピーして保存」を押すと、当選・達成・倍率が roulette-data に反映されます。\n閉じるだけ／再読み込みなら、開く前の状態のままです。</div><textarea class="msg" readonly>${esc(msg)}</textarea>`,
      [{ label: "連絡文をコピーして保存", value: "copy", cls: "red" }, { label: "保存せず閉じる", value: "close", cls: "dark" }]
    );
    if (v === "copy") {
      const ok = await persistSessionEnd(pending);
      if (ok) {
        try { await navigator.clipboard.writeText(msg); } catch (e) {
          const ta = document.createElement("textarea"); ta.value = msg; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        }
        const rem = (hist && hist.week_remaining_slots) || [];
        weekSlotsActive = rem.length > 0;
        weekSlotsContinue = rem.length > 0;
        if (rem.length) activeWeekSlots = [...rem];
        finished = true; renderAll(); refreshArchiveStatus();
        const remMsg = rem.length
          ? `\n残り枠 ${rem.length}人（${rem.join("・")}）は次回ルーレットに持ち越します。`
          : "\n今週枠はすべて消化しました。";
        await info("保存＆コピー完了", "roulette-data に反映し、連絡文をコピーしました。" + remMsg);
      }
    } else {
      await info("未保存", "今回の結果は data に書いていません。\nページを再読み込みすると、開く前の状態に戻ります。");
    }
  }

  function snapshotHistory() {
    const d = { ...(hist || {}) };
    d.done_gomi = [...doneGomi]; d.done_souji = [...doneSouji];
    d.last_gomi_winner = lastG; d.last_souji_winner = lastS;
    d.weights_gomi = { ...wG }; d.weights_souji = { ...wS };
    d.pair_pending_souji = false; d.pair_session_excluded = [];
    d.room_contrib_applied = !!hist.room_contrib_applied;
    alreadyDoneExempt.forEach(m => {
      if (!d.done_gomi.includes(m)) d.done_gomi.push(m);
      if (!d.done_souji.includes(m)) d.done_souji.push(m);
    });
    // 今週枠の未抽選メンバーは次週へ持ち越し（通常プールに落とすと「片方完了」で消える）
    if (useWeekSlots()) {
      const winners = new Set([lastG, lastS].filter(Boolean));
      const rem = [];
      const seen = new Set();
      for (const m of activeWeekSlots) {
        if (seen.has(m) || winners.has(m) || alreadyDoneExempt.has(m)) continue;
        seen.add(m);
        rem.push(m);
      }
      d.week_remaining_slots = rem;
      d.week_slots_finished = rem.length === 0;
    } else {
      d.week_slots_finished = true;
      d.week_remaining_slots = [];
    }
    const p = n => String(n).padStart(2, "0"), now = new Date();
    d.session_close_snapshot = {
      saved_at: `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`,
      done_gomi: [...d.done_gomi], done_souji: [...d.done_souji],
      this_week_gomi_winner: lastG, this_week_souji_winner: lastS,
      weights_gomi: { ...wG }, weights_souji: { ...wS },
      week_remaining_slots: [...(d.week_remaining_slots || [])],
    };
    return d;
  }

  async function persistSessionEnd(historyObj) {
    try {
      const res = await (await fetch(API + "/session-end", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ history: historyObj || snapshotHistory() }),
      })).json();
      if (!res.ok) {
        await info("保存失敗", res.error || "不明なエラー");
        return false;
      }
      hist = historyObj || hist;
      $("info").textContent = "今週の当番を roulette-data に保存しました。";
      return true;
    } catch (e) {
      await info("保存できませんでした", "サーバーに接続できません。もう一度「コピーして保存」を押してください。");
      return false;
    }
  }

  async function refreshArchiveStatus() {
    const el = $("archStatus");
    if (!el) return;
    try {
      const r = await (await fetch(API + "/archives", { cache: "no-store" })).json();
      const list = r.archives || [];
      const idx = list.findIndex(a => a.current);
      const cur = (idx >= 0 ? list[idx] : null) || list[list.length - 1];
      el.textContent = cur
        ? `履歴 ${list.length}件 / 現在: ${cur.saved_at || cur.id}（ゴミ:${cur.gomi || "-"} 掃除:${cur.souji || "-"}）`
        : "まだ週履歴はありません（コピー保存後に増えます）";
      $("archPrevBtn").disabled = idx <= 0;
      $("archNextBtn").disabled = idx < 0 || idx >= list.length - 1;
    } catch (e) {
      el.textContent = "履歴を取得できません";
    }
  }

  async function restoreArchive(direction) {
    if (!confirm(direction === "prev"
      ? "前の週のルーレット開始状態に戻しますか？（現在の data を上書き）"
      : "次の週の状態へ進みますか？（現在の data を上書き）")) return;
    try {
      const r = await (await fetch(API + "/archives/restore", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ direction }),
      })).json();
      if (!r.ok) { await info("戻せませんでした", r.error || ""); return; }
      await info("週履歴を復元", "ページを再読み込みして反映します。");
      location.reload();
    } catch (e) {
      await info("戻せませんでした", "サーバーに接続できません。");
    }
  }

  // ---------- 操作 ----------
  function confirmExclusions() {
    const [ok, err] = canRunBoth();
    if (!ok) { info("確定できません", err); return; }
    confirmed = true; drawRole = ROLE_GOMI; sessionG = null;
    renderAll();
  }
  function cancelConfirm() { confirmed = false; drawRole = ROLE_GOMI; sessionG = null; renderAll(); }
  function clearExclusions() {
    weeklyExcluded.clear(); // 自己申告のみ解除（達成済み扱いは残す）
    cancelConfirm();
  }

  $("confirmBtn").onclick = confirmExclusions;
  $("cancelBtn").onclick = cancelConfirm;
  $("clearBtn").onclick = clearExclusions;
  $("archPrevBtn").onclick = () => restoreArchive("prev");
  $("archNextBtn").onclick = () => restoreArchive("next");
  $("spinBtn").onclick = toggleSpin;
  canvas.addEventListener("click", e => {
    if (busy || finished) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    const dx = x - canvas.width / 2, dy = y - canvas.height / 2;
    if (Math.hypot(dx, dy) <= hubR * 1.2) toggleSpin();
  });
  $("pullBtn").onclick = async () => {
    try {
      const r = await (await fetch(API + "/pull", { method: "POST" })).json();
      if (r.ok) { await info("データ更新", "git pull が完了しました。ページを再読み込みします。"); location.reload(); }
      else info("データ更新", "git pull に失敗しました。\n\n" + (r.error || ""));
    } catch (e) { info("データ更新", "サーバーに接続できません。"); }
  };
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !$("overlay").classList.contains("open") && !/^(INPUT|TEXTAREA|BUTTON)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); toggleSpin();
    }
  });

  // ---------- 起動 ----------
  async function init() {
    requestAnimationFrame(loop);
    let data;
    try { data = await (await fetch(API + "/data", { cache: "no-store" })).json(); }
    catch (e) { $("winner").textContent = "サーバーからデータを取得できませんでした。"; return; }
    weekly = data; members = data.members; hist = data.history || {};
    migrateLegacy(hist);
    // 掃除まで終わらず終了していたデータは無効化（メモリのみ）
    if (hist.pair_pending_souji) { hist.pair_pending_souji = false; hist.pair_session_excluded = []; hist.last_gomi_winner = null; }
    doneGomi = [...(hist.done_gomi || [])]; doneSouji = [...(hist.done_souji || [])];
    lastG = hist.last_gomi_winner ?? null;
    lastS = hist.last_souji_winner ?? null;
    wG = { ...(hist.weights_gomi || {}) };
    wS = { ...(hist.weights_souji || {}) };
    const remSlots = Array.isArray(hist.week_remaining_slots) ? hist.week_remaining_slots.filter(Boolean) : [];
    weekSlotsContinue = remSlots.length > 0;
    weekSlotsActive = weekSlotsContinue || !hist.week_slots_finished;
    activeWeekSlots = weekSlotsContinue ? [...remSlots] : [...THIS_WEEK_SLOTS];
    if (weekSlotsActive && !weekSlotsContinue) {
      // 初回のみ：前回当番はゴミ=幡鎌 / 掃除=芝原
      lastG = "幡鎌";
      lastS = "芝原";
      doneGomi = doneGomi.filter(m => m !== lastG);
      doneSouji = doneSouji.filter(m => m !== lastS);
    }
    const contrib = applyRoomContributionDiscounts();
    renderWeekly();
    computePools(); renderAll();
    refreshArchiveStatus();
    // 先に前回のゴミ・掃除の実施確認（達成済み処理より前）
    await checkPrevious(ROLE_GOMI);
    await checkPrevious(ROLE_SOUJI);
    await checkCycleReset();
    // ボランティア等：達成済み扱い（続き枠では既に外れている想定）
    if (weekSlotsActive && !weekSlotsContinue) {
      const ex = applyAlreadyDoneExemptions();
      computePools();
      let body = "";
      if (contrib.applied && contrib.detail.length) {
        body += "【部屋貢献 → 倍率×0.9（回数ぶん）】\n" +
          contrib.detail.map(d => `・${d.name} ×${d.n}回 → ×${d.mul.toFixed(3)}（いま ${d.w % 1 ? d.w.toFixed(3) : d.w}倍）`).join("\n") + "\n\n";
      }
      if (ex.applied.length) {
        body += "【実施済み → 今週は達成済み扱い】\n" + ex.applied.map(e => `・${e.name}（${e.reason}）`).join("\n") + "\n\n";
      }
      if (ex.leftover.length) {
        body += "【枠外の貢献者（免除対象外・倍率のみ反映）】\n" + ex.leftover.map(e => `・${e.name}（${e.reason}）`).join("\n") + "\n\n";
      }
      if (body) {
        body += "※右パネルの「自己申告：今週ルーレット免除」は別物です。";
        await info("実施済み・貢献の反映", body);
      }
    } else if (contrib.applied && contrib.detail.length) {
      await info("部屋貢献の反映",
        contrib.detail.map(d => `・${d.name} ×${d.n}回 → ×${d.mul.toFixed(3)}`).join("\n"));
    }
    busy = false; renderAll();
  }
  init();
})();
</script>
</body>
</html>
