<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゴミ・掃除当番ルーレット</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #202124;
      --muted: #667085;
      --accent: #d9480f;
      --accent-2: #2563eb;
      --border: #d0d5dd;
      --soft: #fff4e6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    header {
      padding: 18px 20px 10px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
    }

    .note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(280px, 380px);
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px;
    }

    section,
    aside,
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .roulette-area {
      padding: 16px;
    }

    canvas {
      display: block;
      width: min(100%, 680px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 50%;
    }

    .winner {
      min-height: 96px;
      margin: 14px 0;
      padding: 14px;
      background: var(--soft);
      border-radius: 14px;
      color: #9a3412;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 800;
      text-align: center;
      white-space: pre-line;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    button,
    .file-label {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: var(--accent-2);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    button.secondary,
    .file-label {
      background: #475467;
    }

    button.warning {
      background: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    aside {
      padding: 16px;
    }

    h2 {
      margin: 4px 0 10px;
      font-size: 20px;
    }

    h3 {
      margin: 14px 0 8px;
      font-size: 16px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      font: inherit;
    }

    .status,
    .panel {
      padding: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
    }

    .check-list {
      display: grid;
      gap: 8px;
      max-height: 180px;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    label {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .rank {
      margin: 0;
      padding-left: 20px;
      font-size: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    input[type="file"] {
      display: none;
    }

    #fx {
      position: fixed; inset: 0; z-index: 60; display: none; pointer-events: none; overflow: hidden;
    }
    #fx.on { display: block; }
    #fx .fx-bg { position: absolute; inset: 0; }
    #fx.win .fx-bg { background: radial-gradient(circle at 50% 30%, #6e0a24, #120308 70%); }
    #fx.praise .fx-bg { background: radial-gradient(circle at 50% 40%, #fff7b0, #ff6ad5 45%, #4b00a8 90%); }
    #fx.fail .fx-bg { background: #000; }
    #fx.yes .fx-bg { background: radial-gradient(circle at 50% 40%, #ff3b3b, #5a0008 70%, #000); }
    #fx .fx-rays {
      position: absolute; inset: -20%;
      background: repeating-conic-gradient(from 0deg, rgba(255,210,0,.45) 0 8deg, transparent 8deg 16deg);
      animation: spinburst 14s linear infinite; opacity: .5;
    }
    #fx .fx-burst {
      position: absolute; left: 50%; top: 45%; width: 140vmax; height: 140vmax; margin: -70vmax;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0040, #ffd000, #00ff88, #ff00cc, #ff0040);
      animation: spinburst 8s linear infinite; opacity: .55;
    }
    #fx .fx-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 40%, transparent 10%, rgba(0,0,0,.75) 70%);
    }
    #fx .fx-crown {
      position: absolute; left: 50%; top: 8%; transform: translateX(-50%);
      font-size: clamp(40px, 10vw, 84px); filter: drop-shadow(0 0 16px gold);
    }
    #fx .fx-feather, #fx .fx-spark, #fx .fx-fire {
      position: absolute; border-radius: 50%;
    }
    #fx .fx-feather {
      width: 18px; height: 28px; background: linear-gradient(180deg, #fff, #ddd);
      border-radius: 50% 50% 40% 40%; animation: floatDown linear forwards; opacity: .85;
    }
    #fx .fx-spark {
      width: 6px; height: 6px; background: #ffe27a; box-shadow: 0 0 10px #ffd000;
      animation: sparkle ease-out forwards;
    }
    #fx .fx-fire {
      width: 8px; height: 8px; background: #ffb000; box-shadow: 0 0 14px #ff4000;
      animation: firework ease-out forwards;
    }
    @keyframes spinburst { to { transform: rotate(360deg); } }
    @keyframes floatDown {
      from { transform: translateY(-10vh) rotate(0); opacity: 0; }
      15% { opacity: .9; }
      to { transform: translateY(110vh) rotate(240deg); opacity: 0; }
    }
    @keyframes sparkle {
      from { transform: scale(0); opacity: 1; }
      to { transform: scale(1.8) translate(var(--dx), var(--dy)); opacity: 0; }
    }
    @keyframes firework {
      from { transform: translate(0,0) scale(1); opacity: 1; }
      to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
    .toast {
      position: fixed; left: 50%; top: 12%; transform: translateX(-50%); z-index: 70;
      max-width: min(92vw, 520px); padding: 16px 18px; border-radius: 14px;
      background: #111; color: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.35);
      white-space: pre-wrap; display: none;
    }
    .toast.on { display: block; }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ゴミ・掃除当番ルーレット</h1>
    <p class="note">GitHub Pagesで動くサーバーなし版です。名簿と履歴はこのブラウザ内に保存されます。</p>
  </header>
  <div id="fx" aria-hidden="true"><div class="fx-bg"></div><div class="fx-layer"></div></div>
  <div id="toast" class="toast"></div>

  <main>
    <section class="roulette-area">
      <canvas id="wheel" width="760" height="760" aria-label="ルーレット"></canvas>
      <div id="winner" class="winner">名簿を保存して、抽選を始めてください。</div>
      <div class="controls">
        <button id="confirmBtn">除外を確定して抽選開始</button>
        <button id="spinBtn" class="warning" disabled>回す</button>
        <button id="resetSelectionBtn" class="secondary">除外を選び直す</button>
      </div>
    </section>

    <aside>
      <h2>設定</h2>
      <div id="status" class="status"></div>

      <h3>前回の確認</h3>
      <div id="previousPanel" class="panel"></div>

      <h3>名簿</h3>
      <p class="note">1行に1人ずつ書いてください。</p>
      <textarea id="membersInput" spellcheck="false"></textarea>
      <div class="row">
        <button id="saveMembersBtn">名簿を保存</button>
        <button id="resetCycleBtn" class="secondary">一周リセット</button>
      </div>

      <h3>今週ルーレットから除外</h3>
      <div id="excludeList" class="check-list"></div>

      <h3>危険度ランキング</h3>
      <div id="ranking"></div>

      <h3>履歴データ</h3>
      <div class="row">
        <button id="exportBtn">JSONを書き出す</button>
        <label class="file-label" for="importFile">JSONを取り込む</label>
        <input id="importFile" type="file" accept="application/json,.json">
      </div>
      <p class="note">別端末へ移すときは、JSONを書き出して相手の端末で取り込んでください。</p>
    </aside>
  </main>

  <script>
    const STORAGE_KEY = "gomiRouletteWebState.v1";
    const PENALTY_RATE = 10;
    const ROLE_GOMI = "gomi";
    const ROLE_SOUJI = "souji";
    const TICK_DEG = 15;
    const COLORS = ["#ff9aa2", "#ffb7b2", "#ffdac1", "#e2f0cb", "#b5ead7", "#c7ceea", "#f8b195", "#f67280"];
    // 今週枠（名簿本体はそのまま。帳尻合わせで同名の重複枠OK）
    const THIS_WEEK_SLOTS = ["幡鎌", "若旅", "中田", "田中", "芝原", "陳", "白井", "幡鎌", "中田", "伊賀", "上出"];
    const THIS_WEEK_BOOST = { "幡鎌": 10, "芝原": 10 };
    const THIS_WEEK_EXEMPTIONS = [
      { name: "田中", reason: "ゴミ捨てボランティア" },
      { name: "中田", reason: "掃除ボランティア" },
      { name: "海老澤", reason: "プリンタ破棄" },
      { name: "若旅", reason: "プリンタ破棄" },
      { name: "田中", reason: "プリンタ破棄" },
      { name: "椎名", reason: "プリンタ破棄" },
      { name: "田中", reason: "ゴミ捨てボランティア" },
    ];

    const canvas = document.querySelector("#wheel");
    const ctx = canvas.getContext("2d");
    const winnerEl = document.querySelector("#winner");
    const statusEl = document.querySelector("#status");
    const previousPanel = document.querySelector("#previousPanel");
    const membersInput = document.querySelector("#membersInput");
    const excludeList = document.querySelector("#excludeList");
    const rankingEl = document.querySelector("#ranking");
    const confirmBtn = document.querySelector("#confirmBtn");
    const spinBtn = document.querySelector("#spinBtn");
    const resetSelectionBtn = document.querySelector("#resetSelectionBtn");
    const saveMembersBtn = document.querySelector("#saveMembersBtn");
    const resetCycleBtn = document.querySelector("#resetCycleBtn");
    const exportBtn = document.querySelector("#exportBtn");
    const importFile = document.querySelector("#importFile");
    const toastEl = document.querySelector("#toast");

    const SFX = {
      tick: new Audio("./sounds/tick.mp3"),
      click: new Audio("./sounds/click.mp3"),
      win: new Audio("./sounds/win.mp3"),
    };
    Object.values(SFX).forEach((a) => { a.preload = "auto"; a.volume = 0.7; });
    function playSfx(name, vol) {
      const base = SFX[name];
      if (!base) return;
      try {
        const a = base.cloneNode();
        a.volume = vol == null ? base.volume : vol;
        a.currentTime = 0;
        a.play().catch(() => {});
      } catch (e) { /* ignore */ }
    }

    let fxTimer = null;
    function clearFx() {
      const fx = document.querySelector("#fx");
      fx.className = "";
      fx.querySelector(".fx-layer").innerHTML = "";
      if (fxTimer) { clearTimeout(fxTimer); fxTimer = null; }
    }
    function spawnParticles(kind, n) {
      const layer = document.querySelector("#fx .fx-layer");
      for (let i = 0; i < n; i++) {
        const el = document.createElement("div");
        el.className = kind;
        el.style.left = Math.random() * 100 + "%";
        el.style.top = (kind === "fx-feather" ? -5 : 20 + Math.random() * 50) + "%";
        el.style.setProperty("--dx", ((Math.random() - 0.5) * 220) + "px");
        el.style.setProperty("--dy", ((Math.random() - 0.5) * 220) + "px");
        el.style.animationDuration = (kind === "fx-feather" ? 4 + Math.random() * 4 : 0.6 + Math.random() * 0.9) + "s";
        el.style.animationDelay = (Math.random() * 0.8) + "s";
        layer.appendChild(el);
      }
    }
    function withFx(mode, ms = 4500) {
      clearFx();
      const fx = document.querySelector("#fx");
      fx.className = "on " + mode;
      const layer = fx.querySelector(".fx-layer");
      if (mode === "win") {
        layer.innerHTML = '<div class="fx-rays"></div><div class="fx-vignette"></div>';
        spawnParticles("fx-feather", 24); spawnParticles("fx-spark", 36);
      } else if (mode === "praise") {
        layer.innerHTML = '<div class="fx-burst"></div><div class="fx-rays"></div><div class="fx-crown">👑</div><div class="fx-vignette"></div>';
        spawnParticles("fx-spark", 50);
      } else if (mode === "fail") {
        layer.innerHTML = "";
      } else if (mode === "yes") {
        layer.innerHTML = '<div class="fx-rays"></div><div class="fx-vignette"></div>';
        spawnParticles("fx-fire", 40); spawnParticles("fx-spark", 30);
      }
      fxTimer = setTimeout(clearFx, ms);
    }
    function showToast(text, ms = 6000) {
      toastEl.textContent = text;
      toastEl.classList.add("on");
      setTimeout(() => toastEl.classList.remove("on"), ms);
    }

    let state = loadState();
    let confirmed = false;
    let drawRole = ROLE_GOMI;
    let sessionGomiWinner = null;
    let excluded = new Set();
    let answeredPrevious = new Set();
    let angle = 0;
    let spinning = false;
    let lastTickSector = 0;

    function defaultState() {
      return {
        members: ["伊賀", "加藤", "海老澤", "上出", "中田", "陳", "椎名", "白井", "幡鎌", "山中", "谷津", "若旅", "芝原", "田中"],
        history: {
          done_gomi: [],
          done_souji: [],
          last_gomi_winner: null,
          last_souji_winner: null,
          weights_gomi: { "幡鎌": 10, "芝原": 10 },
          weights_souji: { "幡鎌": 10, "芝原": 10 },
          pair_pending_souji: false,
          pair_session_excluded: []
        }
      };
    }

    function useWeekSlots() {
      return THIS_WEEK_SLOTS.length > 0;
    }
    function applyThisWeekBoost() {
      for (const [name, mul] of Object.entries(THIS_WEEK_BOOST)) {
        state.history.weights_gomi[name] = Math.max(state.history.weights_gomi[name] || 1, mul);
        state.history.weights_souji[name] = Math.max(state.history.weights_souji[name] || 1, mul);
      }
    }
    function applyThisWeekExemptions() {
      const onWheel = new Set(THIS_WEEK_SLOTS);
      const applied = [], leftover = [];
      const seen = new Set();
      for (const e of THIS_WEEK_EXEMPTIONS) {
        const k = e.name + "\0" + e.reason;
        if (seen.has(k)) continue;
        seen.add(k);
        if (onWheel.has(e.name)) {
          excluded.add(e.name);
          applied.push(e);
        } else leftover.push(e);
      }
      return { applied, leftover };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return normalizeState(parsed);
      } catch {
        return defaultState();
      }
    }

    function normalizeState(input) {
      const base = defaultState();
      const members = Array.isArray(input.members) ? input.members.filter(Boolean) : base.members;
      const history = { ...base.history, ...(input.history || input) };
      history.done_gomi = Array.isArray(history.done_gomi) ? history.done_gomi : [];
      history.done_souji = Array.isArray(history.done_souji) ? history.done_souji : [];
      history.weights_gomi = history.weights_gomi || {};
      history.weights_souji = history.weights_souji || {};
      return { members, history };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function roleLabel(role) {
      return role === ROLE_GOMI ? "ゴミ捨て" : "掃除";
    }

    function roleWeights(role) {
      const primary = role === ROLE_GOMI ? state.history.weights_gomi : state.history.weights_souji;
      const merged = { ...primary };
      for (const [m, mul] of Object.entries(THIS_WEEK_BOOST)) {
        merged[m] = Math.max(merged[m] || 1, mul);
      }
      return merged;
    }

    function candidatePools() {
      const done = new Set([...state.history.done_gomi, ...state.history.done_souji]);
      const neither = state.members.filter((name) => !done.has(name));
      return { gomi: neither, souji: neither };
    }

    function activePool(role = drawRole) {
      if (useWeekSlots()) {
        let pool = THIS_WEEK_SLOTS.filter((name) => !excluded.has(name));
        if (role === ROLE_SOUJI && sessionGomiWinner) {
          pool = pool.filter((name) => name !== sessionGomiWinner);
        }
        return pool;
      }
      const pools = candidatePools();
      let pool = role === ROLE_GOMI ? pools.gomi : pools.souji;
      pool = pool.filter((name) => !excluded.has(name));
      if (role === ROLE_SOUJI && sessionGomiWinner) {
        pool = pool.filter((name) => name !== sessionGomiWinner);
      }
      return pool;
    }

    function orderedPool(role = drawRole) {
      const weights = roleWeights(role);
      return activePool(role)
        .map((m, i) => ({ m, i, w: weights[m] || 1 }))
        .sort((a, b) => (b.w - a.w) || (a.i - b.i))
        .map((x) => x.m);
    }

    function totalWeight(names, role = drawRole) {
      const weights = roleWeights(role);
      return names.reduce((sum, name) => sum + (weights[name] || 1), 0);
    }

    function drawWheel() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = Math.min(w, h) / 2 - 28;
      ctx.clearRect(0, 0, w, h);

      const names = orderedPool();
      if (!names.length) {
        ctx.fillStyle = "#475467";
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("候補がいません", cx, cy);
        return;
      }

      const weights = roleWeights(drawRole);
      const total = totalWeight(names);
      let start = 0;
      names.forEach((name, index) => {
        const part = ((weights[name] || 1) / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, start + part);
        ctx.closePath();
        ctx.fillStyle = COLORS[index % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4;
        ctx.stroke();

        const mid = start + part / 2;
        ctx.save();
        ctx.translate(cx + Math.cos(mid) * r * 0.58, cy + Math.sin(mid) * r * 0.58);
        ctx.rotate(mid);
        ctx.fillStyle = "#202124";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(name, 0, 0);
        ctx.font = "18px sans-serif";
        ctx.fillText(`x${(weights[name] || 1).toFixed(1)}`, 0, 28);
        ctx.restore();
        start += part;
      });

      const hand = angle - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(hand) * r * 0.72, cy + Math.sin(hand) * r * 0.72);
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#111827";
      ctx.stroke();
    }

    function pickWinner() {
      const names = orderedPool();
      const weights = roleWeights(drawRole);
      const total = totalWeight(names);
      let target = Math.random() * total;
      for (const name of names) {
        target -= weights[name] || 1;
        if (target <= 0) return name;
      }
      return names[names.length - 1];
    }

    function canRunBothDraws() {
      if (useWeekSlots()) {
        return new Set(THIS_WEEK_SLOTS.filter((m) => !excluded.has(m))).size >= 2;
      }
      const gomi = activePool(ROLE_GOMI);
      const souji = activePool(ROLE_SOUJI);
      if (!gomi.length || !souji.length) return false;
      return gomi.some((g) => souji.some((s) => s !== g));
    }

    function confirmExclusions() {
      if (!canRunBothDraws()) {
        alert("ゴミと掃除を両方決められる候補が足りません。除外を減らしてください。");
        return;
      }
      confirmed = true;
      drawRole = ROLE_GOMI;
      sessionGomiWinner = null;
      spinBtn.disabled = false;
      confirmBtn.disabled = true;
      winnerEl.textContent = "1回目：ゴミ捨て当番を抽選します。";
      render();
    }

    function spin() {
      if (!confirmed || spinning || !activePool().length) return;
      spinning = true;
      spinBtn.disabled = true;
      playSfx("click");
      let speed = 0.45 + Math.random() * 0.25;
      let frames = 0;
      let deg = (angle * 180) / Math.PI;
      lastTickSector = Math.floor(((deg % 360) + 360) % 360 / TICK_DEG);
      const timer = setInterval(() => {
        const prevDeg = deg;
        deg = (deg + speed * 57.3) % 360;
        angle = (deg * Math.PI) / 180;
        let from = Math.floor(prevDeg / TICK_DEG);
        const to = Math.floor(deg / TICK_DEG);
        const sectors = 360 / TICK_DEG;
        let steps = 0;
        while (from !== to && steps < 4) {
          from = (from + 1) % sectors;
          playSfx("tick", Math.min(0.85, 0.35 + speed * 2));
          steps++;
        }
        lastTickSector = to;
        speed *= 0.985;
        frames += 1;
        drawWheel();
        if (frames > 90 && speed < 0.08) {
          clearInterval(timer);
          spinning = false;
          playSfx("click");
          finishDraw();
        }
      }, 16);
    }

    function finishDraw() {
      const winner = pickWinner();
      const names = orderedPool();
      const weights = roleWeights(drawRole);
      const winWeight = names.filter((m) => m === winner).reduce((s, m) => s + (weights[m] || 1), 0);
      const rate = (winWeight / totalWeight(names)) * 100;
      playSfx("win");
      withFx("win", 5000);

      if (drawRole === ROLE_GOMI) {
        sessionGomiWinner = winner;
        drawRole = ROLE_SOUJI;
        winnerEl.textContent = `ゴミ捨て当番\n【 ${winner} 】さん（${rate.toFixed(1)}%）\n続けて掃除当番を抽選します。`;
        spinBtn.disabled = false;
      } else {
        applyExclusionBonus();
        state.history.last_gomi_winner = sessionGomiWinner;
        state.history.last_souji_winner = winner;
        state.history.session_close_snapshot = {
          saved_at: new Date().toISOString(),
          done_gomi: [...state.history.done_gomi],
          done_souji: [...state.history.done_souji],
          this_week_gomi_winner: sessionGomiWinner,
          this_week_souji_winner: winner
        };
        saveState();
        winnerEl.textContent = `ゴミ捨て：【 ${sessionGomiWinner} 】さん\n掃除：【 ${winner} 】さん\n掃除の当選確率 ${rate.toFixed(1)}%`;
        confirmed = false;
        drawRole = ROLE_GOMI;
        sessionGomiWinner = null;
        excluded.clear();
        applyThisWeekExemptions();
        confirmBtn.disabled = false;
        spinBtn.disabled = true;
      }
      checkCycleReset(false);
      render();
    }

    function applyExclusionBonus() {
      [ROLE_GOMI, ROLE_SOUJI].forEach((role) => {
        const pools = candidatePools();
        const base = role === ROLE_GOMI ? pools.gomi : pools.souji;
        const weights = roleWeights(role);
        const total = base.reduce((sum, name) => sum + (weights[name] || 1), 0);
        excluded.forEach((name) => {
          const current = weights[name] || 1;
          if (total > 0) weights[name] = current * (1 + current / total);
        });
      });
    }

    function answerPrevious(role, completed) {
      const key = role === ROLE_GOMI ? "last_gomi_winner" : "last_souji_winner";
      const doneKey = role === ROLE_GOMI ? "done_gomi" : "done_souji";
      const last = state.history[key];
      if (!last) return;
      answeredPrevious.add(role);
      if (completed) {
        if (!state.history[doneKey].includes(last)) state.history[doneKey].push(last);
        withFx("yes", 4000);
        showToast(`任務完了！ いざ出陣！\n【 ${last} 】さん`);
      } else {
        const map = role === ROLE_GOMI ? state.history.weights_gomi : state.history.weights_souji;
        map[last] = Math.max(map[last] || 1, PENALTY_RATE);
        withFx("fail", 4000);
        showToast(`任務未完了 / 終了\n${last}さん：今週${PENALTY_RATE}倍`);
      }
      saveState();
      checkCycleReset(true);
      render();
    }

    function checkCycleReset(showMessage) {
      const memberSet = new Set(state.members);
      const gDone = new Set(state.history.done_gomi);
      const sDone = new Set(state.history.done_souji);
      const complete = state.members.length && state.members.every((name) => gDone.has(name) && sDone.has(name));
      if (!complete) return;
      state.history.done_gomi = [];
      state.history.done_souji = [];
      state.history.last_gomi_winner = null;
      state.history.last_souji_winner = null;
      saveState();
      if (showMessage) alert("全員一周完了しました。リストをリセットします。");
    }

    function renderPreviousPanel() {
      const items = [
        [ROLE_GOMI, state.history.last_gomi_winner, state.history.done_gomi],
        [ROLE_SOUJI, state.history.last_souji_winner, state.history.done_souji]
      ].filter(([role, name, done]) => name && !done.includes(name) && !answeredPrevious.has(role));

      if (!items.length) {
        previousPanel.textContent = "確認が必要な前回当番はありません。";
        return;
      }

      previousPanel.innerHTML = "";
      items.forEach(([role, name]) => {
        const div = document.createElement("div");
        div.innerHTML = `<strong>前回の${roleLabel(role)}：</strong>${escapeHtml(name)}さん`;
        const row = document.createElement("div");
        row.className = "row";
        const yes = document.createElement("button");
        yes.textContent = "完了";
        yes.onclick = () => answerPrevious(role, true);
        const no = document.createElement("button");
        no.textContent = "未完了";
        no.className = "warning";
        no.onclick = () => answerPrevious(role, false);
        row.append(yes, no);
        div.append(row);
        previousPanel.append(div);
      });
    }

    function renderExcludeList() {
      const pools = candidatePools();
      const candidates = useWeekSlots()
        ? [...new Set(THIS_WEEK_SLOTS)]
        : [...new Set([...pools.gomi, ...pools.souji])];
      excludeList.innerHTML = "";
      if (!candidates.length) {
        excludeList.textContent = "候補がいません。前回確認か一周リセットをしてください。";
        return;
      }
      candidates.forEach((name) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = excluded.has(name);
        input.disabled = confirmed;
        input.onchange = () => {
          if (input.checked) excluded.add(name);
          else excluded.delete(name);
          render();
        };
        const boost = THIS_WEEK_BOOST[name] ? ` ×${THIS_WEEK_BOOST[name]}` : "";
        const dup = useWeekSlots() && THIS_WEEK_SLOTS.filter((n) => n === name).length > 1
          ? `（枠${THIS_WEEK_SLOTS.filter((n) => n === name).length}）` : "";
        label.append(input, document.createTextNode(name + boost + dup));
        excludeList.append(label);
      });
    }

    function renderRanking() {
      const blocks = [ROLE_GOMI, ROLE_SOUJI].map((role) => {
        const weights = roleWeights(role);
        const names = state.members.slice().sort((a, b) => (weights[b] || 1) - (weights[a] || 1));
        const total = state.members.reduce((sum, name) => sum + (weights[name] || 1), 0);
        const list = names.map((name) => {
          const w = weights[name] || 1;
          const p = total > 0 ? (w / total) * 100 : 0;
          let status = "抽選対象";
          if (excluded.has(name)) status = "今週除外";
          else if (role === ROLE_SOUJI && sessionGomiWinner === name) status = "今回のゴミ当番";
          else if (state.history.done_gomi.includes(name) || state.history.done_souji.includes(name)) status = "今周完了済み";
          return `<li>${escapeHtml(name)}：倍率 ${w.toFixed(2)} / 全体目安 ${p.toFixed(1)}% / ${status}</li>`;
        }).join("");
        return `<strong>${roleLabel(role)}</strong><ol class="rank">${list || "<li>候補なし</li>"}</ol>`;
      });
      rankingEl.innerHTML = blocks.join("");
    }

    function renderStatus() {
      const pools = candidatePools();
      statusEl.textContent = useWeekSlots()
        ? `総メンバー：${state.members.length}人 / 今週枠：${THIS_WEEK_SLOTS.length}（重複込） / 抽選枠：${activePool().length} / 除外：${excluded.size}`
        : `総メンバー：${state.members.length}人 / ゴミ残り：${pools.gomi.length} / 掃除残り：${pools.souji.length}`;
    }

    function render() {
      membersInput.value = state.members.join("\n");
      renderStatus();
      renderPreviousPanel();
      renderExcludeList();
      renderRanking();
      drawWheel();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (s) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[s]));
    }

    saveMembersBtn.onclick = () => {
      const members = membersInput.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      if (members.length < 2) {
        alert("メンバーは2人以上入れてください。");
        return;
      }
      state.members = [...new Set(members)];
      excluded.clear();
      saveState();
      render();
    };

    resetCycleBtn.onclick = () => {
      if (!confirm("ゴミ・掃除の完了リストをリセットしますか？")) return;
      state.history.done_gomi = [];
      state.history.done_souji = [];
      state.history.last_gomi_winner = null;
      state.history.last_souji_winner = null;
      answeredPrevious = new Set();
      saveState();
      render();
    };

    confirmBtn.onclick = confirmExclusions;
    spinBtn.onclick = spin;
    resetSelectionBtn.onclick = () => {
      confirmed = false;
      drawRole = ROLE_GOMI;
      sessionGomiWinner = null;
      excluded.clear();
      applyThisWeekExemptions();
      confirmBtn.disabled = false;
      spinBtn.disabled = true;
      winnerEl.textContent = "除外を選び直しました。";
      render();
    };

    exportBtn.onclick = () => {
      const blob = new Blob([JSON.stringify(state.history, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "duty_history.json";
      a.click();
      URL.revokeObjectURL(url);
    };

    importFile.onchange = async () => {
      const file = importFile.files[0];
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        state = normalizeState({ members: state.members, history: imported });
        saveState();
        render();
        alert("履歴JSONを取り込みました。");
      } catch {
        alert("JSONを読み込めませんでした。");
      } finally {
        importFile.value = "";
      }
    };

    applyThisWeekBoost();
    const ex = applyThisWeekExemptions();
    if (ex.applied.length || ex.leftover.length) {
      let msg = "";
      if (ex.applied.length) {
        msg += "【今週ルーレットから除外】\n" + ex.applied.map((e) => `・${e.name}（${e.reason}）`).join("\n") + "\n\n";
      }
      if (ex.leftover.length) {
        msg += "【次週へ持ち越し】\n" + ex.leftover.map((e) => `・${e.name}（${e.reason}）`).join("\n");
      } else {
        msg += "次週へ持ち越す免除はありません。";
      }
      showToast(msg, 9000);
    }
    render();
  </script>
</body>
</html>
